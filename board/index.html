<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>팀 업무 보드</title>
    <link rel="stylesheet" href="./board.css" />
    <script src="./board.js" defer></script>
  </head>
  <body>
    <main id="work-board">
      <header id="board-header">
        <div>
          <p class="eyebrow">MUSTKHAT · TEAM</p>
          <h1 id="board-title">팀 업무 보드</h1>
          <p class="description" id="board-description">
            업무를 옮기며 팀의 흐름을 확인하세요.
          </p>
        </div>
        <div class="header-controls">
          <div class="lang-toggle" role="group" aria-label="Language / ภาษา">
            <button id="lang-ko" type="button" aria-pressed="true">한국어</button
            ><button id="lang-th" type="button" aria-pressed="false">ไทย</button>
          </div>
          <div class="sync">
            <span id="sync-status" role="status">보드를 불러오는 중…</span
            ><button id="refresh" type="button">새로고침</button>
          </div>
        </div>
      </header>
      <p id="notice" role="alert" hidden></p>
      <section
        id="board-columns"
        aria-label="진행 중인 업무"
        aria-busy="true"
      ></section>
      <p class="footnote" id="footnote">
        9초마다 갱신 · A2 업무는 /wait에서 처리 · 카드 순서는 최근 변경순
      </p>
    </main>
    <dialog id="finish-dialog" aria-labelledby="finish-title">
      <form method="dialog">
        <h2 id="finish-title"></h2>
        <p id="finish-description"></p>
        <div class="dialog-actions">
          <button value="cancel" id="finish-cancel">돌아가기</button
          ><button value="confirm" id="finish-confirm">확인</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
