<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>팀 업무 보드</title>
    <link rel="stylesheet" href="./board.css?v=202609181700" />
    <script src="./board.js?v=202609181700" defer></script>
  </head>
  <body>
    <main id="work-board">
      <header id="board-header">
        <div>
          <p class="eyebrow">MUSTKHAT · TEAM</p>
          <h1 id="board-title">팀 업무 보드</h1>
          <p class="description" id="board-description">
            업무를 옮기며 팀의 흐름을 확인하세요.
          </p>
        </div>
        <div class="header-controls">
          <div class="lang-toggle" role="group" aria-label="Language / ภาษา">
            <button id="lang-ko" type="button" aria-pressed="true">
              한국어</button
            ><button id="lang-th" type="button" aria-pressed="false">
              ไทย
            </button>
          </div>
          <button id="add-task" type="button">+ 새 업무</button>
          <div class="sync">
            <span id="sync-status" role="status">보드를 불러오는 중…</span
            ><button id="refresh" type="button">새로고침</button>
          </div>
        </div>
      </header>
      <p id="notice" role="alert" hidden></p>
      <section
        id="board-columns"
        aria-label="진행 중인 업무"
        aria-busy="true"
      ></section>
      <p class="footnote" id="footnote">
        9초마다 갱신 · A2 업무는 /wait에서 처리 · 카드 순서는 최근 변경순
      </p>
    </main>
    <dialog id="finish-dialog" aria-labelledby="finish-title">
      <form method="dialog">
        <h2 id="finish-title"></h2>
        <p id="finish-description"></p>
        <div class="dialog-actions">
          <button value="cancel" id="finish-cancel">돌아가기</button
          ><button value="confirm" id="finish-confirm">확인</button>
        </div>
      </form>
    </dialog>
    <dialog id="detail-dialog" aria-labelledby="detail-title">
      <form method="dialog">
        <h2 id="detail-title"></h2>
        <dl id="detail-meta"></dl>
        <p id="detail-body"></p>
        <p id="detail-lock-note" class="lock-note" hidden></p>
        <div class="dialog-actions">
          <!-- 2026-09-18 대표님 지시: 카드 상세에서 닫기·수정 자리를 맞바꾼다.
               수정이 왼쪽, 닫기가 오른쪽. 닫기는 form method="dialog"의 유일한
               submit 버튼이라 순서를 바꿔도 엔터키로 닫는 동작은 그대로다. -->
          <button value="edit" id="detail-edit" type="button" hidden>
            수정</button
          ><button value="close" id="detail-close">닫기</button>
        </div>
      </form>
    </dialog>
    <dialog id="add-dialog" aria-labelledby="add-title">
      <form method="dialog" id="add-form">
        <h2 id="add-title">새 업무 등록</h2>
        <div>
          <label id="add-title-label" for="add-task-title">업무 제목</label>
          <input
            id="add-task-title"
            name="title"
            type="text"
            required
            maxlength="200"
          />
        </div>
        <div class="form-columns">
          <div class="field-fill">
            <label id="add-description-label" for="add-task-description"
              >업무 내용</label
            >
            <textarea
              id="add-task-description"
              name="description"
              rows="5"
              maxlength="2000"
            ></textarea>
          </div>
          <div class="side-fields">
            <div>
              <label id="add-due-label" for="add-task-due">마감일</label>
              <div class="date-field">
                <input id="add-task-due" name="dueDate" type="date" />
                <span id="add-due-display" class="date-display placeholder"
                  >연도. 월. 일.</span
                >
              </div>
              <p class="field-hint" id="add-due-hint">
                비워 두면 '마감 미정'으로 올라갑니다.
              </p>
            </div>
            <div>
              <label id="add-assignee-label" for="add-task-assignee"
                >담당자</label
              >
              <select id="add-task-assignee" name="assignee"></select>
            </div>
          </div>
        </div>
        <div class="dialog-actions">
          <button value="cancel" id="add-cancel" type="submit" formnovalidate>
            돌아가기</button
          ><button value="confirm" id="add-confirm" type="submit">등록</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
